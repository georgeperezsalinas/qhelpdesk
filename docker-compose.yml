name: qhelpdesk

services:
  api:
    build: ./backend
    container_name: qhelpdesk_api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8002:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: ./frontend
    container_name: qhelpdesk_web
    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:80"

    depends_on:
      api:
        condition: service_healthy