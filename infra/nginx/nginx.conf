# =========================================================
# HTTP -> HTTPS
# =========================================================
server {
    listen 80;
    server_name qhelpdesk.site www.qhelpdesk.site;
    return 301 https://$host$request_uri;
}

# =========================================================
# HTTPS
# =========================================================
server {
    listen 443 ssl http2;
    server_name qhelpdesk.site www.qhelpdesk.site;

    ssl_certificate     /etc/letsencrypt/live/qhelpdesk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qhelpdesk.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Archivos subidos — servidos directamente desde el host
    location /uploads/ {
        alias   /opt/qhelpdesk/data/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # WebSocket notificaciones (debe ir ANTES del bloque /api/)
    location /api/v1/notificaciones/ws/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend React
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
